[project]
name = "map-routing"
version = "0.1.0"
description = "Weekly visit scheduling and walking-route optimization for field workers (OR-Tools, OpenStreetMap)"
readme = "README.md"
authors = [
    { name = "michaldeco", email = "michal@michaldeco.com" }
]
requires-python = ">=3.14"
dependencies = [
    "folium>=1.0.0",
    "geopandas>=1.2.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "typer>=0.29.2",
]

[project.scripts]
map-routing = "map_routing.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["osmium: needs the osmium command-line tool (skipped if missing)"]
